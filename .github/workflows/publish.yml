# Publishes to the Chrome Web Store when the version in manifest.json changes on main.
#
# A version counts as new when there's no git tag "v<version>" yet, so pushes that
# don't bump the version, and re-runs after a successful publish, do nothing.
# After submitting, it tags the commit and creates a GitHub release with the zip.
#
# The store refuses uploads while another version is in review. The release is still created
# then, with a note at the top that this version may not be on the store, and the zip attached
# to upload by hand once the review ends.
#
# Setup (once): see CONTRIBUTING.md, "Publishing from GitHub".
name: Publish to Chrome Web Store

on:
  push:
    branches: [main]
    paths: [manifest.json]
  workflow_dispatch:
    inputs:
      submit:
        description: Submit for review after uploading (otherwise upload only)
        type: boolean
        default: true

concurrency:
  group: chrome-web-store
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    name: Check for a new version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      new: ${{ steps.version.outputs.new }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        run: |
          version="$(jq -r .version manifest.json)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "v$version is already tagged, so there's nothing to publish." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

  publish:
    name: Publish v${{ needs.check.outputs.version }}
    needs: check
    if: needs.check.outputs.new == 'true'
    runs-on: ubuntu-latest
    # Add required reviewers to this environment in the repository settings to approve each release.
    environment: chrome-web-store
    permissions:
      contents: write # tag and release
      id-token: write # sign in to Google Cloud with Workload Identity Federation
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history and tags, to compare the store listing with the last release

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Test
        run: npm test

      - name: Check versions match
        run: |
          manifest="$(jq -r .version manifest.json)"
          package="$(jq -r .version package.json)"
          [ "$manifest" = "$package" ] || { echo "::error::manifest.json is $manifest but package.json is $package. Use npm run bump."; exit 1; }

      - name: Build package
        run: npm run package

      # The store's API can't edit the listing. If the description, images, permissions or privacy
      # answers changed since the last release, upload without submitting: the store doesn't allow
      # listing edits while a version is in review, so the edits come first and the submit after.
      - name: Check the store listing
        id: listing
        run: |
          scripts/store-listing-checklist.sh > listing-checklist.md
          cat listing-checklist.md >> "$GITHUB_STEP_SUMMARY"

      # No stored secrets: GitHub proves which repository is running, and Google returns a
      # short-lived token for the service account that's added to the Chrome Web Store publisher.
      - name: Sign in to Google Cloud
        id: google
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore
          access_token_lifetime: 900s

      - name: Upload and submit
        id: upload
        env:
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
          CWS_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
          CWS_PUBLISH: ${{ (github.event_name == 'push' || inputs.submit) && steps.listing.outputs.listing_changed != 'true' }}
          CWS_ALLOW_IN_REVIEW: true # release anyway; the notes say it may not be on the store
        run: scripts/publish-chrome-web-store.sh environment-links.zip

      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
          ATTACHMENTS: ${{ steps.listing.outputs.attachments }}
          CWS_RESULT: ${{ steps.upload.outputs.store }}
        run: |
          {
            # When another version was in review, say first that this one may not be on the store.
            case "$CWS_RESULT" in
              not-uploaded)
                echo "> [!WARNING]"
                echo "> **This version may not be published on the Chrome Web Store.** Another version was still in review, so the store refused the upload."
                echo "> Once that review ends, upload \`environment-links.zip\` (attached) in the [Developer Dashboard](https://chrome.google.com/webstore/devconsole) and click **Submit for review**."
                echo ;;
              not-submitted)
                echo "> [!WARNING]"
                echo "> **This version may not be published on the Chrome Web Store yet.** It was uploaded, but another version was still in review, so the store refused to submit it."
                echo "> Once that review ends, click **Submit for review** in the [Developer Dashboard](https://chrome.google.com/webstore/devconsole)."
                echo ;;
            esac
            # The checklist, worded for what the upload did. GitHub's generated notes follow it.
            GITHUB_OUTPUT="" scripts/store-listing-checklist.sh
          } > release-notes.md
          # shellcheck disable=SC2086 # ATTACHMENTS is a space-separated list of repo paths
          gh release create "v$VERSION" environment-links.zip $ATTACHMENTS \
            --target "$GITHUB_SHA" --title "v$VERSION" --notes-file release-notes.md --generate-notes
          echo "Created release v$VERSION." >> "$GITHUB_STEP_SUMMARY"
          case "$CWS_RESULT" in
            not-uploaded) echo "::warning::v$VERSION was released on GitHub but not uploaded to the Chrome Web Store, because another version is in review." ;;
            not-submitted) echo "::warning::v$VERSION was uploaded to the Chrome Web Store but not submitted, because another version is in review." ;;
          esac
