<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
  <!-- Drawn on the 16px grid so every edge lands on a whole pixel: three 2px rows, 2px apart. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#4338ca"/>
    </linearGradient>
  </defs>
  <rect width="16" height="16" rx="3.5" fill="url(#bg)"/>
  <g shape-rendering="crispEdges">
    <rect x="3" y="3" width="2" height="2" fill="#4ade80"/>
    <rect x="6" y="3" width="7" height="2" fill="#fff"/>
    <rect x="3" y="7" width="2" height="2" fill="#facc15"/>
    <rect x="6" y="7" width="7" height="2" fill="#fff"/>
    <rect x="3" y="11" width="2" height="2" fill="#f87171"/>
    <rect x="6" y="11" width="7" height="2" fill="#fff"/>
  </g>
</svg>
