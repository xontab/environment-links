<!--size:1400x560--><html><head><style>{{CSS}}
.row .url { font-size: 17px; } .env { min-width: 130px; }

.brand { font-size: 52px; white-space: nowrap; }

</style></head><body>
  <div><div class="brand"><img src="{{ICON}}">Environment Links</div>

      <div class="row"><span class="dot d2"></span><span class="env">STAGING</span><span class="url">backoffice.staging.example.com</span></div>

      <div class="row"><span class="dot d4"></span><span class="env">PRODUCTION</span><span class="url">backoffice.example.com</span></div>
  </div>
</body></html>
