<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Environment Links</title>
  <link rel="stylesheet" href="options.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body class="popup">
  <label class="search">
    <svg class="search-icon" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
      <circle cx="7" cy="7" r="4.75" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <path d="M10.6 10.6 14 14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    </svg>
    <input id="filter" type="search" placeholder="Search links. Arrow keys to choose, Enter to open" aria-label="Search links" autofocus>
  </label>
  <ul id="list" role="list"></ul>
  <script type="module" src="popup.js"></script>
</body>
</html>
